{# New password + confirm boxes, with suggested passwords to pick from. #}
{% macro new_password_fields() %}
  <label for="new_password">New password <span class="muted">(at least {{ min_length }} characters)</span></label>
  <input id="new_password" name="new_password" type="password" autocomplete="new-password"
         minlength="{{ min_length }}" required>
  <label for="confirm_password">Type the new password again to confirm</label>
  <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password"
         minlength="{{ min_length }}" required>
  <label class="check"><input type="checkbox" id="show_pw"> Show passwords</label>
  {% if suggestions %}
  <div class="suggest">
    <p class="muted">Or choose a suggested password (write it down somewhere safe):</p>
    <div class="row">
      {% for s in suggestions %}<button type="button" class="secondary pick" data-pw="{{ s }}"><code>{{ s }}</code></button>{% endfor %}
    </div>
  </div>
  {% endif %}
  <script>
  (function () {
    var boxes = [document.getElementById("new_password"), document.getElementById("confirm_password")];
    var cur = document.getElementById("current_password");
    if (cur) boxes.push(cur);
    var show = document.getElementById("show_pw");
    show.addEventListener("change", function () {
      boxes.forEach(function (b) { b.type = show.checked ? "text" : "password"; });
    });
    document.querySelectorAll(".pick").forEach(function (btn) {
      btn.addEventListener("click", function () {
        boxes[0].value = boxes[1].value = btn.dataset.pw;
        show.checked = true; show.dispatchEvent(new Event("change"));
        boxes[0].focus();
      });
    });
  })();
  </script>
{% endmacro %}
